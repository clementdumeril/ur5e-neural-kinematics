<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 490" width="1180" height="490" font-family="Helvetica, Arial, sans-serif">

  <rect x="0" y="0" width="1180" height="490" fill="#ffffff"/>

  <!-- ============================ TRAINING ============================ -->
  <text x="40" y="46" font-size="21" font-weight="bold" fill="#111827">TRAINING</text>
  <text x="152" y="46" font-size="16" fill="#6b7280">offline: the error is computed on the pose the angles reach</text>
  <line x1="40" y1="58" x2="1140" y2="58" stroke="#111827" stroke-width="1.5"/>

  <!-- target -->
  <rect x="40" y="120" width="150" height="62" rx="6" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="115" y="146" font-size="15" fill="#111827" text-anchor="middle">Target pose</text>
  <text x="115" y="168" font-size="14" fill="#6b7280" text-anchor="middle">x*, y*, z*</text>

  <line x1="190" y1="151" x2="242" y2="151" stroke="#111827" stroke-width="2"/>
  <polygon points="252,151 240,146 240,156" fill="#111827"/>

  <!-- network -->
  <rect x="254" y="112" width="152" height="78" rx="6" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="330" y="140" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">Neural net</text>
  <text x="330" y="161" font-size="13" fill="#6b7280" text-anchor="middle">3 → 512×3 → 6</text>
  <text x="330" y="179" font-size="13" fill="#6b7280" text-anchor="middle">SiLU</text>

  <line x1="406" y1="151" x2="458" y2="151" stroke="#111827" stroke-width="2"/>
  <polygon points="468,151 456,146 456,156" fill="#111827"/>

  <!-- predicted angles -->
  <rect x="470" y="120" width="132" height="62" rx="6" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="536" y="146" font-size="15" fill="#111827" text-anchor="middle">Joint angles</text>
  <text x="536" y="168" font-size="14" fill="#6b7280" text-anchor="middle">q̂ ∈ ℝ⁶</text>

  <line x1="602" y1="151" x2="654" y2="151" stroke="#2563eb" stroke-width="2.5"/>
  <polygon points="664,151 652,146 652,156" fill="#2563eb"/>

  <!-- differentiable FK : the contribution -->
  <rect x="666" y="104" width="214" height="94" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="773" y="132" font-size="15" font-weight="bold" fill="#1e40af" text-anchor="middle">Differentiable FK</text>
  <text x="773" y="154" font-size="13" fill="#1e40af" text-anchor="middle">Denavit–Hartenberg,</text>
  <text x="773" y="172" font-size="13" fill="#1e40af" text-anchor="middle">rewritten in PyTorch</text>
  <text x="773" y="190" font-size="12" fill="#3b82f6" text-anchor="middle">p̂, R̂ = FK(q̂)</text>

  <line x1="880" y1="151" x2="932" y2="151" stroke="#2563eb" stroke-width="2.5"/>
  <polygon points="942,151 930,146 930,156" fill="#2563eb"/>

  <!-- loss -->
  <rect x="944" y="112" width="196" height="78" rx="6" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="1042" y="138" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">Loss, in millimetres</text>
  <text x="1042" y="160" font-size="13" fill="#6b7280" text-anchor="middle">‖p̂ − p*‖² + r²‖R̂ − R*‖²</text>
  <text x="1042" y="180" font-size="12" fill="#9ca3af" text-anchor="middle">+ 0.1 · branch anchor</text>

  <!-- backprop -->
  <path d="M 1042 190 L 1042 246 L 330 246 L 330 190" fill="none" stroke="#2563eb"
        stroke-width="2.5" stroke-dasharray="7 5"/>
  <polygon points="330,180 324,192 336,192" fill="#2563eb"/>
  <text x="686" y="268" font-size="14" fill="#2563eb" text-anchor="middle">backpropagation through the forward kinematics</text>

  <!-- ============================ DEPLOYMENT ============================ -->
  <text x="40" y="330" font-size="21" font-weight="bold" fill="#111827">DEPLOYMENT</text>
  <text x="204" y="330" font-size="16" fill="#6b7280">in Webots, one network call per target (0.54 ms)</text>
  <line x1="40" y1="342" x2="1140" y2="342" stroke="#111827" stroke-width="1.5"/>

  <!-- perception row -->
  <text x="40" y="384" font-size="13" font-weight="bold" fill="#6b7280">PERCEPTION</text>
  <rect x="40" y="396" width="132" height="58" rx="6" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="106" y="421" font-size="14" fill="#111827" text-anchor="middle">Camera</text>
  <text x="106" y="440" font-size="12" fill="#6b7280" text-anchor="middle">512×512, top-down</text>

  <line x1="172" y1="425" x2="200" y2="425" stroke="#111827" stroke-width="2"/>
  <polygon points="210,425 198,420 198,430" fill="#111827"/>

  <rect x="212" y="396" width="140" height="58" rx="6" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="282" y="421" font-size="14" fill="#111827" text-anchor="middle">Colour threshold</text>
  <text x="282" y="440" font-size="12" fill="#6b7280" text-anchor="middle">+ centroid</text>

  <line x1="352" y1="425" x2="380" y2="425" stroke="#111827" stroke-width="2"/>
  <polygon points="390,425 378,420 378,430" fill="#111827"/>

  <rect x="392" y="396" width="140" height="58" rx="6" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="462" y="421" font-size="14" fill="#111827" text-anchor="middle">Homography</text>
  <text x="462" y="440" font-size="12" fill="#6b7280" text-anchor="middle">1.1 mm residual</text>

  <line x1="532" y1="425" x2="560" y2="425" stroke="#111827" stroke-width="2"/>
  <polygon points="570,425 558,420 558,430" fill="#111827"/>

  <!-- resolution -->
  <text x="572" y="384" font-size="13" font-weight="bold" fill="#2563eb">RESOLUTION</text>
  <rect x="572" y="396" width="150" height="58" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="647" y="421" font-size="14" font-weight="bold" fill="#1e40af" text-anchor="middle">Trained network</text>
  <text x="647" y="440" font-size="12" fill="#1e40af" text-anchor="middle">q₁ … q₆</text>

  <line x1="722" y1="425" x2="750" y2="425" stroke="#111827" stroke-width="2"/>
  <polygon points="760,425 748,420 748,430" fill="#111827"/>

  <!-- actuation -->
  <text x="762" y="384" font-size="13" font-weight="bold" fill="#6b7280">ACTUATION</text>
  <rect x="762" y="396" width="150" height="58" rx="6" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="837" y="421" font-size="14" fill="#111827" text-anchor="middle">Quintic trajectory</text>
  <text x="837" y="440" font-size="12" fill="#6b7280" text-anchor="middle">closed loop on q</text>

  <line x1="912" y1="425" x2="940" y2="425" stroke="#111827" stroke-width="2"/>
  <polygon points="950,425 938,420 938,430" fill="#111827"/>

  <rect x="952" y="396" width="188" height="58" rx="6" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="1046" y="421" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">UR5e pick &amp; place</text>
  <text x="1046" y="440" font-size="12" fill="#6b7280" text-anchor="middle">grasp, transport, drop</text>

</svg>
