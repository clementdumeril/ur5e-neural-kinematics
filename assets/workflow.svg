<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 232" width="1180" height="232" font-family="Helvetica, Arial, sans-serif">

  <rect x="0" y="0" width="1180" height="232" fill="#ffffff"/>

  <!-- ============================ DEPLOYMENT ============================ -->
  <text x="40" y="46" font-size="21" font-weight="bold" fill="#111827">DEPLOYMENT</text>
  <text x="204" y="46" font-size="16" fill="#6b7280">in Webots, one network call per move (0.54 ms)</text>
  <line x1="40" y1="58" x2="1140" y2="58" stroke="#111827" stroke-width="1.5"/>

  <!-- perception row -->
  <text x="40" y="100" font-size="13" font-weight="bold" fill="#6b7280">PERCEPTION</text>
  <rect x="40" y="112" width="132" height="58" rx="6" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="106" y="137" font-size="14" fill="#111827" text-anchor="middle">Camera</text>
  <text x="106" y="156" font-size="12" fill="#6b7280" text-anchor="middle">512×512, top-down</text>

  <line x1="172" y1="141" x2="200" y2="141" stroke="#111827" stroke-width="2"/>
  <polygon points="210,141 198,136 198,146" fill="#111827"/>

  <rect x="212" y="112" width="140" height="58" rx="6" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="282" y="137" font-size="14" fill="#111827" text-anchor="middle">Colour threshold</text>
  <text x="282" y="156" font-size="12" fill="#6b7280" text-anchor="middle">+ centroid</text>

  <line x1="352" y1="141" x2="380" y2="141" stroke="#111827" stroke-width="2"/>
  <polygon points="390,141 378,136 378,146" fill="#111827"/>

  <rect x="392" y="112" width="140" height="58" rx="6" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="462" y="137" font-size="14" fill="#111827" text-anchor="middle">Homography</text>
  <text x="462" y="156" font-size="12" fill="#6b7280" text-anchor="middle">1.1 mm residual</text>

  <line x1="532" y1="141" x2="560" y2="141" stroke="#111827" stroke-width="2"/>
  <polygon points="570,141 558,136 558,146" fill="#111827"/>

  <!-- resolution -->
  <text x="572" y="100" font-size="13" font-weight="bold" fill="#2563eb">RESOLUTION</text>
  <rect x="572" y="112" width="150" height="58" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="647" y="137" font-size="14" font-weight="bold" fill="#1e40af" text-anchor="middle">Trained network</text>
  <text x="647" y="156" font-size="12" fill="#1e40af" text-anchor="middle">q₁ … q₆</text>

  <line x1="722" y1="141" x2="750" y2="141" stroke="#111827" stroke-width="2"/>
  <polygon points="760,141 748,136 748,146" fill="#111827"/>

  <!-- actuation -->
  <text x="762" y="100" font-size="13" font-weight="bold" fill="#6b7280">ACTUATION</text>
  <rect x="762" y="112" width="150" height="58" rx="6" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="837" y="137" font-size="14" fill="#111827" text-anchor="middle">Quintic trajectory</text>
  <text x="837" y="156" font-size="12" fill="#6b7280" text-anchor="middle">closed loop on q</text>

  <line x1="912" y1="141" x2="940" y2="141" stroke="#111827" stroke-width="2"/>
  <polygon points="950,141 938,136 938,146" fill="#111827"/>

  <rect x="952" y="112" width="188" height="58" rx="6" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="1046" y="137" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">UR5e pick &amp; place</text>
  <text x="1046" y="156" font-size="12" fill="#6b7280" text-anchor="middle">grasp, transport, drop</text>

  <text x="40" y="212" font-size="13" fill="#6b7280">The network solves every move to the cube and the tray. The camera reading pose (x = -0.10 m) is outside its training box, so it stays on the closed-form IK.</text>

</svg>
